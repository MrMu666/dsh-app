# 移动端打包工作流：完全依赖 GitHub Actions，本地不做任何打包
#
# 触发方式：
#   1. 手动触发：Actions 页面 → mobile-build → Run workflow，可选 android / ios / both
#   2. 推送 tag：git tag v0.1.0 && git push origin v0.1.0  → 同时出 Android + iOS 包
#
# Android 产物：APK + AAB（debug 签名；正式签名见下方注释）
# iOS 产物：IPA（未配置 Apple Secrets 时为未签名包，仅用于测试）
#
# ⚠️ iOS 前置条件：src-tauri/gen/apple 的 Xcode 工程必须在 Mac 上执行一次
#    `npm run tauri -- ios init` 生成后提交进仓库，否则 iOS job 无法构建。

name: mobile-build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "要构建的平台"
        type: choice
        options:
          - both
          - android
          - ios
        default: both
  push:
    tags:
      - "v*"

permissions:
  contents: write # 允许 tauri-action 创建 GitHub Release 并上传产物

jobs:
  android:
    name: Android (APK/AAB)
    runs-on: ubuntu-latest
    # 手动触发时按输入过滤；tag 触发时两个 job 都跑
    if: github.event_name == 'push' || inputs.platform != 'ios'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Android (APK/AAB)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: app-v__VERSION__
          releaseName: "App v__VERSION__"
          args: android build --apk --aab
          # 正式签名（可选）：把 keystore 文件及密码放入仓库 Secrets 后取消注释
          # keystorePath: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          # keystorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          # keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK/AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-outputs
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

  ios:
    name: iOS (IPA)
    runs-on: macos-14 # 自带 Xcode，Tauri 的 iOS 构建只能在 macOS 上进行
    if: github.event_name == 'push' || inputs.platform != 'android'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install frontend dependencies
        run: npm ci

      - name: Build iOS (IPA)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 正式签名需要 Apple Developer Program 付费账号（$99/年）
          # 免费账号无法在 CI 上长期签名分发
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: src-tauri
          tagName: app-v__VERSION__
          releaseName: "App v__VERSION__"
          args: ios build

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-outputs
          path: |
            src-tauri/gen/apple/build/**/*.app
            src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: warn
