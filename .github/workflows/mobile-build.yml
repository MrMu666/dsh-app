# 移动端打包工作流：完全依赖 GitHub Actions，本地不做任何打包
#
# 触发方式：
#   1. 手动触发：Actions 页面 → mobile-build → Run workflow，可选 android / ios / both
#   2. 推送 tag：git tag v0.1.0 && git push origin v0.1.0  → 同时出 Android + iOS 包
#
# Android 产物：debug 签名 APK + AAB（可直接安装测试）
# iOS 产物：IPA（未配置 Apple Secrets 时真机构建会因缺少签名证书失败，见 iOS job 注释）
#
# 注意：tauri-action 的移动端支持（mobile input）仅存在于 dev 分支、从未发布，
#       @v0 最新发布版（v0.6.2）不支持 Android/iOS，因此这里直接调用 tauri CLI 构建。

name: mobile-build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "要构建的平台"
        type: choice
        options:
          - both
          - android
          - ios
        default: both
      publish_release:
        description: "构建完成后是否发布 GitHub Release（手动触发时有效；tag 触发始终发布）"
        type: boolean
        default: true
      release_tag:
        description: "手动发布时使用的 tag（留空自动生成 manual-<序号>）"
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write # 允许创建 GitHub Release 并上传产物

jobs:
  android:
    name: Android (APK/AAB)
    runs-on: ubuntu-latest
    # 手动触发时按输入过滤；tag 触发时两个 job 都跑
    if: github.event_name == 'push' || inputs.platform != 'ios'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        run: npm ci

      - name: Init Android project
        run: npm run tauri -- android init

      # 内网 DeepSeek Harness 地址是明文 HTTP（如 192.168.1.1:3080），
      # 模板默认 release 禁明文流量，直接把 Manifest 占位符替换为 true（debug/release 均生效）
      - name: Allow cleartext HTTP for LAN addresses
        run: sed -i 's|android:usesCleartextTraffic="${usesCleartextTraffic}"|android:usesCleartextTraffic="true"|' src-tauri/gen/android/app/src/main/AndroidManifest.xml

      # Android 15+/16 强制 edge-to-edge，WebView 内容会侵占状态栏；
      # 在主题中 opt-out，让 App 内容从状态栏下方开始（Android 14- 无此属性，忽略即可）
      - name: Keep app content below Android status bar
        run: find src-tauri/gen/android/app/src/main/res -name "themes.xml" -exec sed -i 's|<!-- Customize your theme here. -->|<item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>|' {} +

      # 配置了签名 Secrets（ANDROID_KEYSTORE_BASE64 等）时：注入 release 签名并构建
      # 正式签名 release 包（APK/AAB，--split-per-abi 按 CPU 架构拆包，单包更小）；
      # 未配置时回退 debug 构建（debug 签名可安装，但体积大，仅测试用）
      - name: Build Android (APK/AAB)
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "$GITHUB_WORKSPACE/src-tauri/gen/android/upload-keystore.jks"
            cat > src-tauri/gen/android/keystore.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=${GITHUB_WORKSPACE}/src-tauri/gen/android/upload-keystore.jks
          EOF
            python3 .github/scripts/inject-android-signing.py
            npm run tauri -- android build --apk --aab --split-per-abi
          else
            echo "::warning::未配置签名 Secrets（ANDROID_KEYSTORE_*），回退构建 debug 包（体积大，仅测试用）"
            npm run tauri -- android build --debug --apk
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK/AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-outputs
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

      # 发布 GitHub Release（Android 产物；iOS 产物在 Actions artifacts 中下载）
      # - tag 触发（v*）：始终发布，tag 用 tag 名
      # - 手动触发：默认发布（可取消勾选），tag 用输入值或自动生成 manual-<run_number>
      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || (inputs.release_tag != '' && inputs.release_tag || format('manual-{0}', github.run_number)) }}
          name: App ${{ github.event_name == 'push' && github.ref_name || (inputs.release_tag != '' && inputs.release_tag || format('manual-{0}', github.run_number)) }}
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

  ios:
    name: iOS (IPA)
    runs-on: macos-14 # 自带 Xcode，Tauri 的 iOS 构建只能在 macOS 上进行
    if: github.event_name == 'push' || inputs.platform != 'android'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install frontend dependencies
        run: npm ci

      - name: Init iOS Xcode project
        run: npm run tauri -- ios init

      # 内网 DeepSeek Harness 地址是明文 HTTP（如 192.168.1.1:3080），
      # iOS ATS 默认禁止，需要注入 NSAllowsArbitraryLoads 豁免
      - name: Allow cleartext HTTP (ATS) for LAN addresses
        run: |
          PLIST=$(find src-tauri/gen/apple -name "Info.plist" -not -path "*Pods*" | head -n 1)
          echo "Info.plist: $PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"

      # 出可安装的 IPA 需要签名 Secrets（APPLE_CERTIFICATE 等，需 Apple Developer 付费账号）；
      # 未配置时真机构建会因缺少签名证书失败，属预期行为
      - name: Build iOS (IPA)
        run: npm run tauri -- ios build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-outputs
          path: |
            src-tauri/gen/apple/build/**/*.app
            src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: warn
